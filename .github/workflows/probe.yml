name: Direct probe
# Замер режима «без сервера» против настоящего YouTube (ручной запуск или ветка probe)
on:
  workflow_dispatch:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true
      - name: Dependencies
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs || true
          flutter gen-l10n
      - name: Probe
        env:
          CT_PROBE: '1'
        run: flutter test test/direct_probe_test.dart --reporter expanded 2>&1 | grep -E "PROBE|LOG|====|Error|error" | head -400
