name: Deploy test
# Прогон server/deploy.sh на чистой машине (без домена и сертификата) и снимки сайта.
on:
  workflow_dispatch:
  push:
    branches: [deploytest]
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: deploy.sh
        run: |
          sudo -E env CT_SKIP_TLS=1 CT_DOMAIN=ct.test CT_USER=admin CT_PASS=testpass123 \
            CT_REPO=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }} \
            bash server/deploy.sh 2>&1 | grep -E '^##' ; echo "exit=${PIPESTATUS[0]}"
          echo "---- debug (хвост)"; sudo tail -40 /var/log/ct-deploy.debug || true
      - name: Проверки
        run: |
          H=(-H "Host: ct.test" -u admin:testpass123)
          echo "главная:"; curl -s "${H[@]}" http://127.0.0.1/ | grep -o '<title>[^<]*</title>\|/custom/yt.css[^"]*\|/custom/brand.js[^"]*' | head
          for u in /custom/yt.css /custom/brand.js /logo.svg /manifest.webmanifest /ct-pwa/icon-192.png /api/v1/stats /ct-api/caps /login /ctadmin/whoami /ctadmin/; do
            echo "$u → $(curl -s -o /dev/null -w '%{http_code} %{size_download}b' "${H[@]}" http://127.0.0.1$u)"
          done
          echo "страница входа Invidious:"; curl -s "${H[@]}" http://127.0.0.1/login | grep -o '/custom/inv.css[^"]*' | head -1
          echo "без пароля: $(curl -s -o /dev/null -w '%{http_code}' -H 'Host: ct.test' http://127.0.0.1/)"
          echo "приглашение без пароля сайта: $(curl -s -o /dev/null -w '%{http_code}' -H 'Host: ct.test' http://127.0.0.1/invite/nonexistent)"
          echo "ctinvite: $(sudo ctinvite new -n test 2>&1 | head -2 | tr '\n' ' ')"
          sudo systemctl is-active cloudtube-feed cloudtube-live cloudtube-invite cloudtube-ytsync nginx docker
          sudo docker ps --format '{{.Names}} {{.Status}}'
      - name: Подписки YouTube (/ctsubs)
        run: |
          H=(-H "Host: ct.test" -u admin:testpass123)
          P=(-H "Origin: http://ct.test" -H "Content-Type: application/json")
          st() { curl -s "${H[@]}" http://127.0.0.1/ctsubs/api/state; echo; }
          echo "страница: $(curl -s -o /dev/null -w '%{http_code} %{size_download}b' "${H[@]}" http://127.0.0.1/ctsubs/)"
          echo "без пароля: $(curl -s -o /dev/null -w '%{http_code}' -H 'Host: ct.test' http://127.0.0.1/ctsubs/api/state)"
          echo "чужой сайт: $(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" -H 'Origin: https://evil.example' -X POST http://127.0.0.1/ctsubs/api/clear)"
          echo "состояние:"; st
          printf 'Channel Id,Channel Url,Channel Title\nUCX6OQ3DkcsbYNE6H8uQQuVA,http://www.youtube.com/channel/UCX6OQ3DkcsbYNE6H8uQQuVA,MrBeast\nUCBR8-60-B28hp2BmDPdntcQ,http://www.youtube.com/channel/UCBR8-60-B28hp2BmDPdntcQ,YouTube\n' > /tmp/subs.csv
          echo "csv:"; curl -s "${H[@]}" -H "Origin: http://ct.test" -H "Content-Type: text/csv" --data-binary @/tmp/subs.csv http://127.0.0.1/ctsubs/api/csv; echo
          for i in $(seq 1 30); do sleep 3; s=$(st); echo "$s" | grep -q '"running": true' || break; done; echo "после csv: $s"
          echo "API подписок Invidious: $(sudo docker exec invidious-db psql -U kemal -d invidious -Atc "select array_to_json(subscriptions) from users where email='admin'")"
          echo "каналы в базе: $(sudo docker exec invidious-db psql -U kemal -d invidious -Atc "select count(*) from channels")  сессий осталось: $(sudo docker exec invidious-db psql -U kemal -d invidious -Atc "select count(*) from session_ids")"
          echo "плитки: $(curl -s "${H[@]}" http://127.0.0.1/ctsubs/api/strip | head -c 400)"
          echo "ролики канала: $(curl -s "${H[@]}" 'http://127.0.0.1/ctsubs/api/channel?id=UCBR8-60-B28hp2BmDPdntcQ' | head -c 300)"
          echo "удалить все:"; curl -s "${H[@]}" "${P[@]}" -d '{}' http://127.0.0.1/ctsubs/api/clear | head -c 300; echo
          echo "вернуть:"; curl -s "${H[@]}" "${P[@]}" -d '{}' http://127.0.0.1/ctsubs/api/undo | head -c 300; echo
          echo "вход в YouTube (код):"; curl -s "${H[@]}" "${P[@]}" -d '{}' http://127.0.0.1/ctsubs/api/link | grep -o '"login": {[^}]*}' | sed 's/"code": "[^"]*"/"code": "…"/'
          curl -s -o /dev/null "${H[@]}" "${P[@]}" -d '{}' http://127.0.0.1/ctsubs/api/link-cancel
          sudo journalctl -u cloudtube-ytsync --no-pager | tail -15
      - name: Присмотр за companion
        run: |
          systemctl list-timers --all | grep -E 'cloudtube-(guard|update)' || echo "таймеров нет"
          sudo cat /etc/cloudtube-guard.env
          sudo /opt/cloudtube-addons/guard.sh check; sudo /opt/cloudtube-addons/guard.sh status
          sudo /opt/cloudtube-addons/guard.sh update
          sudo tail -20 /var/log/ct-deploy.debug | grep -i guard || true
      - name: Снимки
        run: |
          for p in "/" "/login" "/ctadmin/" "/ctsubs/"; do
            n=$(echo "$p" | tr -c 'a-z' '_')
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --host-resolver-rules="MAP ct.test 127.0.0.1" --window-size=1366,860 \
              --virtual-time-budget=15000 --screenshot=/tmp/shot$n.png "http://admin:testpass123@ct.test$p" 2>/dev/null || true
            ls -la /tmp/shot$n.png 2>/dev/null && { echo "SHOT$n:"; base64 -w0 /tmp/shot$n.png; echo; }
          done
