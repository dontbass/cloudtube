include: package:flutter_lints/flutter.yaml

analyzer:
  # сгенерированный код не проверяем
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.gr.dart"
    - "lib/l10n/generated/**"
    - "third_party/**"
  language:
    # без неявных приведений типов: ошибки вида «ожидали число, пришла строка»
    # ловятся при сборке, а не у пользователя
    strict-casts: true

linter:
  rules:
    - sort_pub_dependencies
    # «забытые» асинхронные вызовы — частая причина гонок и тихих ошибок
    - unawaited_futures
    - cancel_subscriptions
    - close_sinks
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - use_build_context_synchronously
