name: Build Windows

# Отдельная сборка для Windows. Android-сборку и релизы не трогает:
# запускается только из ветки windows (или вручную) и выкладывает zip как артефакт.
on:
  push:
    branches: [main, windows]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022   # VS 2022 — её понимает Flutter 3.35
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true

      - name: Dependencies
        shell: bash
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs || true
          flutter gen-l10n

      - name: Build
        shell: bash
        run: flutter build windows --release --build-name=1.1.${{ github.run_number }} --build-number=${{ github.run_number }}

      - name: Package
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          Compress-Archive -Path "$out\*" -DestinationPath "CloudTube-windows-x64.zip"

      # Один файл CloudTube.exe: Enigma Virtual Box «зашивает» библиотеки и папку data внутрь exe —
      # при запуске ничего не распаковывается на диск, программа видит файлы как настоящие.
      - name: Single exe (Enigma Virtual Box)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest "https://enigmaprotector.com/assets/files/enigmavb.exe" -OutFile evb-setup.exe
          Start-Process .\evb-setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
          $con = Get-ChildItem "C:\Program Files*\Enigma Virtual Box\enigmavbconsole.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $con) { $con = Get-ChildItem "C:\Program Files*" -Recurse -Filter enigmavbconsole.exe -ErrorAction SilentlyContinue | Select-Object -First 1 }
          if (-not $con) { throw "enigmavbconsole.exe не найден" }
          Write-Host "EVB: $($con.FullName)"
          $rel = (Resolve-Path "build\windows\x64\runner\Release").Path
          $exe = Join-Path $rel "CloudTube.exe"
          $outExe = Join-Path (Get-Location) "CloudTube.exe"
          function Esc([string]$t) { [Security.SecurityElement]::Escape($t) }
          function Add-Dir([string]$path) {
            $sb = New-Object System.Text.StringBuilder
            foreach ($f in Get-ChildItem -LiteralPath $path -File) {
              if ($f.FullName -ieq $exe) { continue }
              [void]$sb.Append("<File><Type>2</Type><Name>$(Esc $f.Name)</Name><File>$(Esc $f.FullName)</File><ActiveX>False</ActiveX><ActiveXInstall>False</ActiveXInstall><Action>0</Action><OverwriteDateTime>False</OverwriteDateTime><OverwriteAttributes>False</OverwriteAttributes><PassCommandLine>False</PassCommandLine><HideFromDialogs>0</HideFromDialogs></File>")
            }
            foreach ($d in Get-ChildItem -LiteralPath $path -Directory) {
              [void]$sb.Append("<File><Type>3</Type><Name>$(Esc $d.Name)</Name><Action>0</Action><OverwriteDateTime>False</OverwriteDateTime><OverwriteAttributes>False</OverwriteAttributes><HideFromDialogs>0</HideFromDialogs><Files>")
              [void]$sb.Append((Add-Dir $d.FullName))
              [void]$sb.Append("</Files></File>")
            }
            return $sb.ToString()
          }
          $files = Add-Dir $rel
          $xml = @"
          <?xml version="1.0" encoding="windows-1252"?>
          <>
            <InputFile>$(Esc $exe)</InputFile>
            <OutputFile>$(Esc $outExe)</OutputFile>
            <Files>
              <Enabled>True</Enabled>
              <DeleteExtractedOnExit>False</DeleteExtractedOnExit>
              <CompressFiles>True</CompressFiles>
              <Files>
                <File><Type>3</Type><Name>%DEFAULT FOLDER%</Name><Action>0</Action><OverwriteDateTime>False</OverwriteDateTime><OverwriteAttributes>False</OverwriteAttributes><HideFromDialogs>0</HideFromDialogs><Files>$files</Files></File>
              </Files>
            </Files>
            <Registries><Enabled>False</Enabled><Registries></Registries></Registries>
            <Packaging><Enabled>False</Enabled></Packaging>
            <Options><ShareVirtualSystem>False</ShareVirtualSystem><MapExecutableWithTemporaryFile>True</MapExecutableWithTemporaryFile><TemporaryFileMask></TemporaryFileMask><AllowRunningOfVirtualExeFiles>True</AllowRunningOfVirtualExeFiles><ProcessesOfAnyPlatforms>False</ProcessesOfAnyPlatforms></Options>
            <Storage><Files><Enabled>False</Enabled><Folder>%DEFAULT FOLDER%\</Folder><RandomFileNames>False</RandomFileNames><EncryptContent>False</EncryptContent></Files></Storage>
          </>
          "@
          [IO.File]::WriteAllText("cloudtube.evb", $xml.Trim(), [Text.Encoding]::GetEncoding(1252))
          & $con.FullName cloudtube.evb
          if (-not (Test-Path $outExe)) { throw "CloudTube.exe не собран" }
          "{0:N1} МБ" -f ((Get-Item $outExe).Length / 1MB)
          # версия для самообновления
          @{ version = "1.1.${{ github.run_number }}" } | ConvertTo-Json | Out-File -Encoding utf8 CloudTube-windows.json

      - uses: actions/upload-artifact@v4
        with:
          name: CloudTube-windows-x64
          path: CloudTube-windows-x64.zip

      # Пробная версия: отдельный пре-релиз windows-preview (перезаписывается).
      # Пре-релизы не видны обновлению Android-приложения (оно смотрит только releases/latest).
      - name: Preview release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/windows'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-preview
          name: CloudTube для Windows — пробная версия
          prerelease: true
          make_latest: false
          body: |
            CloudTube для Windows (x64), версия 1.1.${{ github.run_number }}.
            **CloudTube.exe** — один файл, ничего не распаковывает: положите в любую папку (например, «Документы» или рабочий стол) и запустите. Обновляется сам.
            **CloudTube-windows-x64.zip** — запасной вариант, если антивирус не доверяет упакованному файлу: распакуйте и запустите CloudTube.exe.
            При первом запуске Windows может показать «Система Windows защитила ваш компьютер» — «Подробнее» → «Выполнить в любом случае».
            Сборка ${{ github.sha }}.
          files: |
            CloudTube.exe
            CloudTube-windows-x64.zip
            CloudTube-windows.json

      # Проверка запуска: открываем приложение, ждём, делаем снимок экрана и сохраняем лог.
      - name: Smoke test
        shell: pwsh
        run: |
          # проверяем именно однофайловую сборку
          $exe = Get-Item ".\CloudTube.exe"
          Write-Host "exe: $($exe.FullName)"
          $p = Start-Process $exe.FullName -PassThru -RedirectStandardOutput app.out.txt -RedirectStandardError app.err.txt
          Start-Sleep -Seconds 25
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("smoke.png")
          if ($p.HasExited) { Write-Host "ПРИЛОЖЕНИЕ ЗАКРЫЛОСЬ, код $($p.ExitCode)" ; "exited $($p.ExitCode)" | Out-File smoke-status.txt }
          else { Write-Host "приложение работает"; "running" | Out-File smoke-status.txt; Stop-Process -Id $p.Id -Force }
          Get-Content app.out.txt -ErrorAction SilentlyContinue | Select-Object -Last 80
          Get-Content app.err.txt -ErrorAction SilentlyContinue | Select-Object -Last 40
          # снимок экрана — в лог (base64 JPEG), чтобы его можно было посмотреть без скачивания артефактов
          $small = New-Object System.Drawing.Bitmap $bmp, 1280, ([int](1280 * $b.Height / $b.Width))
          $small.Save("smoke.jpg", [System.Drawing.Imaging.ImageFormat]::Jpeg)
          Write-Host "SMOKE-JPEG-BEGIN"
          Write-Host ([Convert]::ToBase64String([IO.File]::ReadAllBytes("smoke.jpg")))
          Write-Host "SMOKE-JPEG-END"

      # Режим без сервера: главная и воспроизведение видео прямо с YouTube
      - name: Smoke test direct
        shell: pwsh
        env:
          CT_SMOKE_DIRECT: '1'
          CT_SMOKE_VIDEO: 'jNQXAC9IVRw'
        run: |
          Remove-Item -Recurse -Force "$env:APPDATA\com.example" -ErrorAction SilentlyContinue
          Get-ChildItem $env:APPDATA | Where-Object { Test-Path "$($_.FullName)\*\cloudtube.db" } | ForEach-Object { Remove-Item -Recurse -Force $_.FullName }
          $exe = Get-Item ".\CloudTube.exe"
          $p = Start-Process $exe.FullName -PassThru -RedirectStandardOutput direct.out.txt -RedirectStandardError direct.err.txt
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $small = New-Object System.Drawing.Bitmap $bmp, 1280, ([int](1280 * $b.Height / $b.Width))
            $small.Save("$name.jpg", [System.Drawing.Imaging.ImageFormat]::Jpeg)
            Write-Host "$name-JPEG-BEGIN"
            Write-Host ([Convert]::ToBase64String([IO.File]::ReadAllBytes("$name.jpg")))
            Write-Host "$name-JPEG-END"
          }
          Start-Sleep -Seconds 10; Shot "HOME"
          Start-Sleep -Seconds 25; Shot "VIDEO"
          if ($p.HasExited) { Write-Host "DIRECT: приложение закрылось" } else { Write-Host "DIRECT: работает"; Stop-Process -Id $p.Id -Force }
          Start-Sleep -Seconds 1
          Get-Content direct.out.txt -ErrorAction SilentlyContinue | Select-String -Pattern "CtDirect|SEVERE|WARNING|Error" | Select-Object -Last 40

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke
          path: |
            smoke.png
            smoke-status.txt
            app.out.txt
            app.err.txt

  # Контроль: Android-сборка из этой же ветки (без подписи и релиза) — чтобы изменения для Windows
  # ничего не сломали на телефоне.
  android-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true
      - name: Build APK (arm64, без подписи)
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs || true
          flutter gen-l10n
          flutter build apk --release --target-platform android-arm64
          ls -la build/app/outputs/flutter-apk/
