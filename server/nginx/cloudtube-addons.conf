# CloudTube server add-ons — nginx.
# 1) В http { } (например, /etc/nginx/conf.d/00-cloudtube-map.conf):
#
#    map $arg_q $ct_search_upstream {
#        default          http://127.0.0.1:3000;   # Invidious
#        "~*^ct(%3A|:)"   http://127.0.0.1:3200;   # сервис дополнений (feed.py)
#    }
#
# 2) Внутри server { } вашего Invidious — этот файл:  include /etc/nginx/snippets/cloudtube-addons.conf;
#    Порты 3000 (Invidious) и 3200 (feed.py) поменяйте на свои.

# персональная «Главная» вместо популярного Invidious
location = /api/v1/popular {
    proxy_pass http://127.0.0.1:3200;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# разделы «Навигатора» и Shorts: поиск с q=ct:<раздел> уходит в feed.py, остальное — в Invidious
location = /api/v1/search {
    proxy_pass $ct_search_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# служебное API: /ct-api/caps, /ct-api/comments (yt-dlp), /ct-api/avatars
location ^~ /ct-api/ {
    proxy_pass http://127.0.0.1:3200;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
}

# «Подписки YouTube» (ytsync.py, порт 3500): работает только за паролем сайта (basic auth) —
# логин сайта = аккаунт Invidious, nginx передаёт его в X-Remote-User. Ставится: server/install-ytsync.sh
location ^~ /ctsubs {
    limit_except GET POST { deny all; }
    proxy_pass http://127.0.0.1:3500;
    proxy_set_header Host $host;
    proxy_set_header X-Remote-User $remote_user;
    proxy_read_timeout 120s;
}
