name: Проверка кода
# Анализатор и тесты на рабочих ветках (stage*): без сборки APK и релизов
on:
  push:
    branches: ['stage*']
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.3'
          channel: stable
          cache: true
      - run: flutter config --no-analytics && flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
        continue-on-error: true
      - run: flutter gen-l10n
      - name: Анализатор
        run: dart analyze --fatal-infos lib test || true
      - name: Тесты
        run: flutter test --reporter expanded || true
