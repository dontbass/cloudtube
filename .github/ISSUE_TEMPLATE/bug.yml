name: Ошибка
description: Что-то работает не так
labels: [bug]
body:
  - type: input
    id: version
    attributes: {label: Версия приложения, description: "«Вы» → «Проверить обновления»", placeholder: "1.1.3"}
    validations: {required: true}
  - type: input
    id: device
    attributes: {label: Устройство и Android, placeholder: "Pixel 7, Android 15 / Android TV"}
  - type: dropdown
    id: addons
    attributes:
      label: Сервер
      options: ["Invidious с дополнениями CloudTube (server/)", "Обычный Invidious", "Не знаю"]
  - type: textarea
    id: what
    attributes: {label: Что случилось, description: "Шаги, ожидание и результат. Скриншоты приветствуются."}
    validations: {required: true}
